global:
  scrape_interval: 5s

scrape_configs:

  # ----------------------------
  # Prometheus itself
  # ----------------------------
  - job_name: "prometheus"
    static_configs:
      - targets:
          - localhost:9090

  # ----------------------------
  # node-exporter (VM / host metrics)
  # ----------------------------
  - job_name: "node-exporter"
    static_configs:
      - targets:
          - localhost:9100

  # ----------------------------
  # kube-state-metrics (PORT-FORWARDED)
  # ----------------------------
  - job_name: "kube-state-metrics"
    static_configs:
      - targets:
          - localhost:19080
  # ------------------------
# ----------------------------
  # minikube-cadvisor (Direct VM-to-Minikube)
  # ----------------------------
  - job_name: 'kubernetes-nodes-cadvisor'
    scheme: https
    tls_config:
      cert_file: /home/nti/.minikube/profiles/minikube/client.crt
      key_file: /home/nti/.minikube/profiles/minikube/client.key
      insecure_skip_verify: true
    static_configs:
      - targets:
          - 192.168.49.2:10250 # <-- REPLACE this IP with your actual $(minikube ip)
