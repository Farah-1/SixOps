# config.yaml
optimization:
  min_memory: 0.5
  max_memory: 4.0
  safety_margin: 1.2  # زيادة 20% كأمان فوق الاستخدام الفعلي
  hpa_min_replicas: 2
  hpa_max_replicas: 8
  replica_threshold: 0.3  
  cpu_target_percent: 60

  min_cpu_millicores: 50
  max_cpu_millicores: 3000
  cpu_safety_margin: 2
  cpu_optimization_threshold: 0.5

  storage_safety_margin: 1.3
  min_storage_gb: 5
  max_storage_gb: 500

  idle_node_cpu_threshold: 20
  idle_node_memory_threshold: 20
  unused_service_cost: 0.05
  idle_node_cost_per_hour: 0.30
  unused_api_cost: 0.01